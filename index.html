<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Без зума пальцами: CRM — приложение, а не страница; текст крупнее — «Настройки → Оформление» -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/tishka-icon.svg" />
    <!-- Установка CRM как приложения (PWA): манифест, значки; service worker — src/pwa. Только здесь,
         не на страницах сайта (site/*.html) — устанавливается CRM, а не каталог клиник -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tish" />
    <!-- Превью ссылки (Instagram, Telegram, WhatsApp) — роботы соцсетей JS не выполняют. Для /start, /login
         и /app сборка делает копии со своими текстами (vite.config.ts → tish-share-pages) -->
    <title>Tish CRM</title>
    <meta name="description" content="Программа для стоматологии: расписание, самозапись пациентов в Telegram, напоминания, медкарта, касса и склад." />
    <meta property="og:title" content="Tish — программа для стоматологии" />
    <meta property="og:description" content="Расписание, самозапись пациентов в Telegram, напоминания, медкарта, касса и склад — в одном приложении." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tish.kg/" />
    <meta property="og:image" content="https://tish.kg/about/og-about.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tish: расписание клиники на компьютере и день врача в телефоне" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Tish" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Telegram Mini App: CRM открывается и из бота (ADR 0002); вне Telegram скрипт ничего не делает -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
