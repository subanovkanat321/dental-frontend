<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Без зума пальцами: CRM — приложение, а не страница; текст крупнее — «Настройки → Оформление» -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/tishka-icon.svg" />
    <!-- Установка CRM как приложения (PWA): манифест, значки; service worker — src/pwa. Только здесь,
         не на страницах сайта (site/*.html) — устанавливается CRM, а не каталог клиник -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tish" />
    <title>Tish CRM</title>
    <!-- Telegram Mini App: CRM открывается и из бота (ADR 0002); вне Telegram скрипт ничего не делает -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
