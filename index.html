<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Без зума пальцами: CRM — приложение, а не страница; текст крупнее — «Настройки → Оформление» -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" href="/tishka-icon.svg" />
    <!-- Установка CRM как приложения (PWA): манифест, значки; service worker — src/pwa. Только здесь,
         не на страницах сайта (site/*.html) — устанавливается CRM, а не каталог клиник -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tish" />
    <!-- «/» без входа в браузере — главная для пациентов (src/site/Home.tsx): её находят поисковики и ей делятся,
         поэтому title, описание и превью — про запись к стоматологу. Сотрудник с входом видит CRM, у вкладки — своё название
         (App.tsx). Для /start, /login и /app сборка делает копии со своими текстами (vite.config.ts → tish-share-pages) -->
    <title>Tish — запись к стоматологу в Бишкеке онлайн</title>
    <meta name="description" content="Выберите стоматологию и врача в Бишкеке и других городах Кыргызстана, посмотрите свободное время и запишитесь онлайн за минуту — без звонков." />
    <meta property="og:title" content="Tish — запись к стоматологу онлайн" />
    <meta property="og:description" content="Клиники и врачи-стоматологи: выберите свободное время и запишитесь за минуту — на сайте или в Telegram." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tish.kg/" />
    <meta property="og:image" content="https://tish.kg/assets/og-tish-1.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Тишка — талисман Tish: запись к стоматологу онлайн" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Tish" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Telegram Mini App: CRM открывается и из бота (ADR 0002); вне Telegram скрипт ничего не делает -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Без JavaScript (часть роботов) — суть главной и ссылки: каталог клиник и вход для клиник -->
    <noscript>
      <h1>Tish — запись к стоматологу онлайн</h1>
      <p>Выберите клинику и врача, посмотрите свободное время и запишитесь за минуту.</p>
      <p><a href="/clinics">Все клиники</a> · <a href="/about">Для клиник</a> · <a href="/login">Вход для клиник</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
