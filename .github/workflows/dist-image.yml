# Готовый фронт для сервера: на каждый push в main — образ ghcr.io/subanovkanat321/dental-frontend-dist с тегом
# полного коммита (и main). Сервер скачивает его в deploy/update-crm.sh (репозиторий dental) вместо сборки у себя.
# Репозиторий публичный — минуты Actions бесплатные. Пакет должен быть публичным (один раз: GitHub → Packages →
# dental-frontend-dist → Package settings → Change visibility → Public), иначе сервер не скачает без входа
name: Образ фронта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dist
          push: true
          tags: |
            ghcr.io/subanovkanat321/dental-frontend-dist:${{ github.sha }}
            ghcr.io/subanovkanat321/dental-frontend-dist:main
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
