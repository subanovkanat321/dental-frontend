<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Нет интернета — Tish</title>
    <link rel="icon" href="/tishka-icon.svg" />
    <!-- Страница без сети (sw.js отдаёт её, когда сервер недоступен): всё внутри файла, без скриптов —
         политика источников (CSP) встроенные скрипты не пускает, а стили разрешены -->
    <style>
      :root { color-scheme: light dark; --page: #F3F6F6; --card: #FFFFFF; --text: #0F2A30; --hint: #4C6268; --accent: #0E8A80; }
      @media (prefers-color-scheme: dark) { :root { --page: #0D1A1D; --card: #13252A; --text: #E4EFEF; --hint: #93AAB0; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
        background: var(--page); color: var(--text); font: 16px/1.5 "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 360px; text-align: center; padding: 28px 20px; border-radius: 10px; background: var(--card); }
      img { width: 72px; height: auto; }
      h1 { font-size: 1.25rem; margin: 12px 0 6px; }
      p { margin: 0 0 18px; color: var(--hint); }
      a { display: inline-block; padding: 10px 20px; border-radius: 8px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/tishka-icon.svg" alt="" />
      <h1>Нет интернета</h1>
      <p>Откройте, когда появится связь. Расписание и пациенты хранятся на сервере — ничего не потерялось.</p>
      <a href="">Обновить</a>
    </main>
  </body>
</html>
